<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; text-align: center; }
  .icon { font-size: 2.5rem; margin-bottom: 1rem; }
  h1 { font-size: 1.2rem; color: #fff; margin-bottom: 0.75rem; }
  p  { color: #888; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.75rem; }
  a  { display: inline-block; padding: 0.65rem 1.5rem; background: #222; border: 1px solid #333; border-radius: 8px; color: #aaa; font-size: 0.85rem; text-decoration: none; transition: all 0.2s; }
  a:hover { border-color: #555; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">⚠️</div>
  <h1>Something went wrong</h1>
  <p>{{message}}</p>
  <a href="/">← Back to store</a>
</div>
</body>
</html>
